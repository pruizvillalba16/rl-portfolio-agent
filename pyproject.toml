[project]
name = "rl-portfolio"
version = "0.1.0"
description = "Reinforcement learning agent for ETF allocation, evaluated with walk-forward validation."
readme = "README.md"
authors = [
    { name = "Pablo Ruiz Villalba", email = "263749187+pruizvillalba16@users.noreply.github.com" }
]
requires-python = ">=3.12,<3.13"
dependencies = []

[dependency-groups]
dev = [
    "pre-commit>=4.7",
    "pytest>=9.2",
    "ruff>=0.17",
]

[build-system]
requires = ["uv_build>=0.13.9,<0.14.0"]
build-backend = "uv_build"

[tool.ruff]
target-version = "py312"
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = [
    "E",    # pycodestyle errors
    "W",    # pycodestyle warnings
    "F",    # pyflakes
    "I",    # isort (import order)
    "B",    # flake8-bugbear (likely bugs)
    "UP",   # pyupgrade (modern syntax)
    "SIM",  # flake8-simplify
    "NPY",  # numpy-specific rules (e.g. legacy np.random)
]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = ["-ra", "--strict-markers", "--strict-config"]
markers = [
    "slow: long-running tests (e.g. short training runs); deselect with -m 'not slow'",
]
